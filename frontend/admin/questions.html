<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Questions · CampusQuest admin</title><link rel="stylesheet" href="css/admin.css"></head><body data-page="questions"><div class="shell"><main class="main"><header class="head"><div><h1>Questions</h1><p>Add MCQs individually or import a CSV.</p></div></header><div class="split"><section class="panel"><h2>Add question</h2><form><select id="subject" name="subject_id"></select><input name="unit" type="number" min="1" placeholder="Unit number" required><input name="topic" placeholder="Topic" value="General"><textarea name="question_text" placeholder="Question" required></textarea><div class="two"><input name="optionA" placeholder="Option A" required><input name="optionB" placeholder="Option B" required><input name="optionC" placeholder="Option C" required><input name="optionD" placeholder="Option D" required></div><div class="two"><select name="correct_answer"><option>A</option><option>B</option><option>C</option><option>D</option></select><select name="difficulty"><option>EASY</option><option selected>MEDIUM</option><option>HARD</option></select></div><textarea name="explanation" placeholder="Explanation"></textarea><button>Add question</button></form><hr><label class="muted">Bulk CSV (subject,unit,question,optionA,optionB,optionC,optionD,correct,difficulty)</label><input id="bulk" type="file" accept=".csv,text/csv"></section><section class="panel"><h2>Question bank</h2><table><thead><tr><th>ID</th><th>Question</th><th>Subject</th><th></th></tr></thead><tbody id="rows"></tbody></table></section></div><p id="notice" class="notice"></p></main></div><script src="js/admin.js"></script></body></html>
