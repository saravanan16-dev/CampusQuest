<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - CampusQuest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <nav class="navbar navbar-dark navbar-cq">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-mortarboard-fill text-primary me-2"></i>CampusQuest
            </a>
            <a href="login.html" class="btn btn-outline-light btn-sm rounded-pill">Sign In</a>
        </div>
    </nav>

    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card-cq p-4">
                    <div class="text-center mb-4">
                        <div class="avatar-circle mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.25rem;">
                            <i class="bi bi-person-plus-fill"></i>
                        </div>
                        <h4 class="fw-bold mb-1">Create Student Account</h4>
                        <p class="text-muted small">Join CampusQuest to track progress, solve practice arenas, and rank up</p>
                    </div>

                    <div id="error-alert" class="alert alert-danger d-none py-2 small" role="alert"></div>

                    <form id="register-form">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Full Name</label>
                            <input type="text" class="form-control" id="name" placeholder="e.g. Alex Johnson" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-semibold">Username</label>
                                <input type="text" class="form-control" id="username" placeholder="alexj" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-semibold">Role</label>
                                <select class="form-select" id="role">
                                    <option value="STUDENT" selected>Student</option>
                                    <option value="ADMIN">Admin</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Email Address</label>
                            <input type="email" class="form-control" id="email" placeholder="alex@engineering.edu" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-semibold">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="At least 6 characters" minlength="6" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-semibold mb-3" id="submit-btn">
                            Create Account & Get 50 XP
                        </button>
                    </form>

                    <div class="text-center border-top pt-3">
                        <small class="text-muted">Already registered? <a href="login.html" class="fw-semibold text-primary">Sign in</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const role = document.getElementById('role').value;
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('error-alert');
            const submitBtn = document.getElementById('submit-btn');

            errorAlert.classList.add('d-none');
            submitBtn.disabled = true;
            submitBtn.innerText = "Creating account...";

            try {
                const res = await API.register({ name, username, email, role, password });
                if (res.success) {
                    const token = res.token || res.data?.token;
                    const user = res.data?.user || res.data;
                    API.setToken(token);
                    API.setUser(user);
                    Auth.showToast("Account created successfully! Welcome bonus +50 XP awarded.", "success");
                    setTimeout(() => {
                        window.location.href = user.role === 'ADMIN' ? 'admin.html' : 'dashboard.html';
                    }, 500);
                } else {
                    errorAlert.innerText = res.message || "Registration failed";
                    errorAlert.classList.remove('d-none');
                }
            } catch (err) {
                errorAlert.innerText = err.message || "Failed to connect to server";
                errorAlert.classList.remove('d-none');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Create Account & Get 50 XP";
            }
        });
    </script>
</body>
</html>
