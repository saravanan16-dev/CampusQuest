<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - CampusQuest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <nav class="navbar navbar-dark navbar-cq">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-mortarboard-fill text-primary me-2"></i>CampusQuest
            </a>
            <a href="register.html" class="btn btn-outline-light btn-sm rounded-pill">Create Account</a>
        </div>
    </nav>

    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card-cq p-4">
                    <div class="text-center mb-4">
                        <div class="avatar-circle mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.25rem;">
                            <i class="bi bi-lock-fill"></i>
                        </div>
                        <h4 class="fw-bold mb-1">Welcome Back</h4>
                        <p class="text-muted small">Sign in to continue your learning quest</p>
                    </div>

                    <div id="error-alert" class="alert alert-danger d-none py-2 small" role="alert"></div>

                    <form id="login-form">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Email or Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="login-input" placeholder="student@campusquest.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" id="password-input" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-semibold mb-3" id="submit-btn">
                            Sign In
                        </button>
                    </form>

                    <!-- Quick Demo Credentials Fill -->
                    <div class="border-top pt-3 text-center">
                        <small class="text-muted d-block mb-2">Quick Demo Access:</small>
                        <div class="d-flex gap-2 justify-content-center">
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill" onclick="fillDemo('student')">
                                Demo Student
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill" onclick="fillDemo('admin')">
                                Demo Admin
                            </button>
                        </div>
                    </div>
                </div>

                <div class="text-center mt-3">
                    <small class="text-muted">Don't have an account? <a href="register.html" class="fw-semibold text-primary">Register here</a></small>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
